<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920"><title>砂岩浮雕 · 百种画风实测</title><link rel="stylesheet" href="assets/base.css"><script src="assets/gsap.min.js"></script><script src="assets/timing.js"></script><style>#captions{left:64px;top:1600px;width:952px}#caption-text{font-size:60px}</style></head><body><main id="root" data-composition-id="main" data-person-travel="0.55" data-width="1080" data-height="1920" data-fps="30" data-duration="36.666666666666664"><div id="surface"></div><div id="architecture"></div><div id="style-label">砂岩浮雕 · AI概念图</div><header id="heading"><p id="kicker"></p><h1 id="title"></h1><p id="subtitle"></p></header><div id="art"></div><div id="scene-labels"></div><div id="person" data-layout-allow-overflow><div id="person-mask"><video id="presenter" class="clip" src="assets/master.mp4" data-start="0" data-duration="36.666666666666664" data-media-start="0" data-track-index="0" data-has-audio="false" muted playsinline></video></div></div><div id="captions"><p id="caption-text"></p></div><div id="recap"><span>少冲动</span><span>守本金</span><span>减负债</span></div><div id="progress"></div><footer id="credit">人物原色 · 角落圆窗 · 原声保留

async function build(){
const P=window.STUDY_TIMING,F=P.fps,D=Number(document.querySelector('#root').dataset.duration),O=Number(document.querySelector('#root').dataset.originFrame||0)/F,$=s=>document.querySelector(s),clamp=x=>Math.min(1,Math.max(0,x)),out=x=>1-(1-clamp(x))**3,smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,u)=>a+(b-a)*u;
for(const[k,v]of Object.entries(LOOK.palette))$('#root').style.setProperty('--'+k,v);$('#root').dataset.look=LOOK.key;document.head.insertAdjacentHTML('beforeend',`<style>${LOOK.css||''}</style>`);
const starts=Object.fromEntries(P.scenes.map(s=>[s.id,s.startFrame/F])),base=LOOK.base||{x:190,y:565,w:700},personTravel=Number(document.querySelector('#root').dataset.personTravel||.55),noteDelay=Math.max(.7,Math.round((personTravel+.15)*1000)/1000);
function pose(t){let p={...base};for(const [id,x]of [['chain',716],['overview',64],['spend',716],['risk',64]]){if(t<starts[id])continue;const u=smooth((t-starts[id])/personTravel);p={x:mix(p.x,x,u),y:mix(p.y,1255,u),w:mix(p.w,300,u)}}if(t>=starts.recap){const u=smooth((t-starts.recap-.1)/.6);p={x:mix(p.x,base.x,u),y:mix(p.y,base.y,u),w:mix(p.w,base.w,u)}}return{...p,circle:true}}
const titles={hook:['越努力上班','越存不到钱？'],chain:['跟风的代价','最后落在自己身上'],overview:['三个财经底线','先把选择排个顺序'],spend:['无效消费','分清想要和需要'],risk:['守住本金','先看风险，再做选择'],debt:['减少负债','把压力往回收'],recap:['不跟风，不浮躁','回到自己的判断']},notes={chain:'从习惯到后果，\n代价由自己承担。',overview:'三项并列建议，\n从自己的选择开始。',spend:'下单之前，\n先留一点判断的空间。',risk:'先守住本金，\n再想下一步。',debt:'',hook:'',recap:''},breaks={'为什么越努力上班越存不到钱':'为什么越努力上班\n越存不到钱','给大家三个普通人的财经底线':'给大家三个普通人的\n财经底线','市面上夸大收益理财的都暗藏风险':'市面上夸大收益理财的\n都暗藏风险'};
const art=await buildArt({P,container:$('#art'),surface:$('#surface'),architecture:$('#architecture'),clamp,out,smooth,mix});await document.fonts.ready;
function render(t){t=Math.max(0,Math.min(P.duration-1/F,t));const frame=Math.floor(t*F+.001),sc=P.scenes.find(s=>frame>=s.startFrame&&frame<s.endFrame)||P.scenes.at(-1),age=t-sc.startFrame/F,c=P.captions.find(c=>frame>=c.startFrame&&frame<c.endFrame),p=pose(t);$('#root').dataset.scene=sc.id;$('#kicker').textContent=sc.kicker;$('#title').textContent=titles[sc.id][0];$('#subtitle').textContent=titles[sc.id][1];$('#caption-text').textContent=c?(breaks[c.text]||c.text):'';$('#captions').style.opacity=c?'1':'0';gsap.set('#person',{x:p.x,y:p.y,scale:p.w/840});gsap.set('#heading',{opacity:sc.id==='hook'?1:.5+.5*out(age/.2),y:sc.id==='hook'?0:12*(1-out(age/.2))});$('#art').style.opacity=['hook','recap'].includes(sc.id)?(LOOK.heroArt?1:0):1;$('#scene-labels').textContent=notes[sc.id];gsap.set('#scene-labels',{x:['overview','risk'].includes(sc.id)?341:0,opacity:out((age-noteDelay)/.3)});gsap.set('#recap',{opacity:sc.id==='recap'?out((age-.85)/.4):0});gsap.set('#progress',{scaleX:t/P.duration});art.render(t,sc.id,age,frame);window.STUDY_STATE={frame,scene:sc.id,look:LOOK.key,portrait:{...p,width:p.w,height:p.w},captionId:c?.id||null};}
const clock={t:0},timeline=gsap.timeline({paused:true});timeline.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>render(clock.t+O)});render(O);window.STUDY_RENDER=render;window.STUDY_POSE=pose;window.__timelines=window.__timelines||{};window.__timelines.main=timeline;window.STUDY_READY=true;
}
window.__hf=window.__hf||{};window.__hf.buildReady=window.__hf.buildReady||{};window.__hf.buildReady.material=build();
