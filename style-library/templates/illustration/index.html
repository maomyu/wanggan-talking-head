const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},out=x=>1-Math.pow(1-clamp(x),3),mix=(a,b,u)=>a+(b-a)*u;
const bases={geometry:{x:150,y:550,w:780},magazine:{x:250,y:610,w:760},collage:{x:130,y:560,w:820},line:{x:160,y:570,w:760,circle:true},illustration:{x:150,y:560,w:780,circle:true},precision:{x:160,y:570,w:760},comic:{x:130,y:580,w:820},film:{x:90,y:520,w:900},ink:{x:190,y:600,w:700,circle:true},pixel:{x:150,y:570,w:780}};

async function build(){await document.fonts.ready;
 const titles=document.querySelectorAll('#heading>span'),person=document.getElementById('person'),mask=document.getElementById('person-mask'),caption=document.getElementById('caption-text'),panels=[...document.querySelectorAll('.panel')];
 const draws=[...document.querySelectorAll('[data-draw]')].map(el=>({el,len:el.getTotalLength()}));draws.forEach(({el,len})=>el.style.strokeDasharray=String(len));

 function render(t){t=Math.max(0,Math.min(P.duration-1/F,t));const frame=Math.floor(t*F+.001),sc=P.scenes.find(s=>frame>=s.startFrame&&frame<s.endFrame)||P.scenes.at(-1),age=t-sc.startFrame/F;
  titles.forEach((el,i)=>el.textContent=sc.title[i]||'');document.getElementById('kicker').textContent=sc.kicker+' / '+String(P.scenes.indexOf(sc)+1).padStart(2,'0');document.getElementById('page-no').textContent=String(P.scenes.indexOf(sc)+1).padStart(2,'0')+' / 07';
  gsap.set('#heading',{opacity:sc.id==='hook'?1:.35+.65*out(age/.24),y:sc.id==='hook'?0:16*(1-out(age/.24))});
  const c=P.captions.find(c=>frame>=c.startFrame&&frame<c.endFrame);caption.textContent=c?(linebreak[c.text]||c.text):'';document.getElementById('captions').style.opacity=c?'1':'0';
  const p=poseAt(t);gsap.set(person,{x:p.x-120,y:p.y-550,scale:p.w/840,rotation:0});mask.style.borderRadius=p.circle?'50%':'0';person.dataset.window=p.circle?'circle':'main';
  panels.forEach(el=>{el.style.opacity=el.dataset.scene===sc.id?'1':'0';});
  for(const el of anim){const scene=el.closest('.panel'),base=starts[scene.dataset.scene],absolute=el.dataset.at?Number(el.dataset.at)/F:base+Number(el.dataset.delay||0);let u=out((t-absolute)/Number(el.dataset.dur||.45));let k=el.dataset.enter;let px=0,py=0,scale=1,rot=0;
   if(k==='left')px=-65*(1-u);else if(k==='right')px=65*(1-u);else if(k==='up')py=40*(1-u);else if(k==='scrap'){py=-70*(1-u);rot=Number(el.dataset.tilt||-5)*(1-u);}else if(k==='pop'){scale=.78+.22*u;}else if(k==='pixel'){u=Math.floor(u*6)/6;px=-48*(1-u);}else if(k==='wipe'){el.style.clipPath=`inset(0 ${100*(1-u)}% 0 0)`;}
   if(el.dataset.bob&&u===1)py+=Math.sin((t-absolute)*1.4+Number(el.dataset.bob))*4;
   gsap.set(el,{opacity:u,x:px,y:py,scale,rotation:rot,svgOrigin:el.dataset.pivot||'476 350'});
  }
