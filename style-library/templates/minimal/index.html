async function build(){
 await document.fonts.ready;let three=null;if(look==='blueprint'||look==='clay'){const mod=await import('./assets/finance-three.mjs');three=await mod.createFinanceScene({mount:document.getElementById('three-mount'),look,P});}

   document.querySelectorAll('.compare-item').forEach((el,i)=>{const u=smooth((age-.08-i*.1)/.38);reveal(el,u,(i?1:-1)*28,0);});

  }
