<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网感口播 · 在线预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#26362e;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;padding:26px;margin:auto}.grid{display:grid;grid-template-columns:minmax(220px,400px) 1fr;gap:30px}video{display:block;width:100%;max-height:80vh;aspect-ratio:9/16;background:#142027}button{font:inherit;color:white;background:#244b42;border:0;border-radius:5px;padding:10px 16px;cursor:pointer}.row{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}a{color:#245a63}img{max-width:100%;margin-top:22px}h1{font-size:28px}p{color:#53665c}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>网感口播 · 在线预览</h1><div class="grid"><section><video id="video" controls playsinline preload="metadata" src="outputs/final.mp4" poster="outputs/poster.jpg"></video><div class="row"><button id="play">▶ 在线播放</button><button id="full">全屏</button></div><p id="status" role="status">点击播放，可拖动进度并调节音量。</p></section><aside><p>本页播放本次项目的实际成片。</p><p><a href="outputs/final.mp4" download>下载MP4</a></p><p><a href="qa/delivery.json">查看本次核验</a></p></aside></div><img src="outputs/contact.jpg" alt="本次成片实际抽帧"></main><script>const v=document.querySelector('video'),s=document.querySelector('#status');document.querySelector('#play').onclick=async()=>{try{await v.play();s.textContent='正在在线播放。'}catch{s.textContent='请点击播放器内的播放按钮。'}};document.querySelector('#full').onclick=()=>v.requestFullscreen?.();v.addEventListener('error',()=>s.textContent='视频暂时无法加载，请确认成片已生成。');</script></body></html>
