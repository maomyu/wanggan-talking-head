<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部视频案例 · 网感口播</title><link rel="stylesheet" href="samples.css"></head><body>
<header><a href="./#top">网感口播 / 正式制作</a><a href="./#selection">回到配方选择 ↗</a></header>
<main><section class="intro"><p class="eyebrow">VIDEO LIBRARY / 案例总览</p><h1>全部样片，在这里看。</h1><p id="summary">正在读取视频目录…</p><p class="note">点击视频直接播放，点“放大观看”查看完整大图。旧版案例保留为历史参考，沿用现在的母画风、分支与组件分类。</p></section>
<section aria-label="搜索与播放"><div id="filters" role="group" aria-label="样片分类"></div><div class="toolbar"><input id="query" type="search" aria-label="搜索样片" placeholder="搜索：水墨、同物接力、节奏…"><button id="play-filtered">播放筛选结果 · 静音</button><button id="pause">全部暂停</button><button id="reset">回到开头</button></div><p id="status" role="status"></p><p class="note">单独听某一条，点击“听这条原声”；页面始终只保留一路声音。全部播放的启动结果会显示在这里。</p></section>
<div id="grid" class="grid"></div><p id="empty" hidden>没有匹配的样片，换个名称或分类试试。</p>
<footer>人物原色 · 角落圆窗 · 字幕上移 · 只展示已有完整视频</footer></main>
<dialog id="viewer"><div class="dialog-head"><h2 id="viewer-title"></h2><button id="close">关闭 ×</button></div><video id="large" controls playsinline preload="none"></video><a id="download" download>下载该视频</a></dialog>
<script type="module" src="samples.js"></script></body></html>
